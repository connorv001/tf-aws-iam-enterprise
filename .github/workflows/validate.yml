name: "Validate IAM Modules"

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.5.7

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        run: |
          for dir in $(find modules -maxdepth 2 -type d); do
            if [ -f "$dir/main.tf" ] || [ -f "$dir/providers.tf" ]; then
              echo "Validating $dir"
              (cd "$dir" && terraform init -backend=false && terraform validate)
            fi
          done

      - name: Checkov Scan
        uses: bridgecrewio/checkov-action@master
        with:
          directory: modules
          quiet: true
          framework: terraform

      - name: Setup Conftest
        uses: open-policy-agent/setup-conftest@v1

      - name: OPA Policy Test (Conftest)
        run: |
          for dir in $(find modules -maxdepth 2 -type d); do
            if [ -f "$dir/main.tf" ] || [ -f "$dir/providers.tf" ]; then
              echo "Testing policies for $dir"
              (cd "$dir" && terraform init -backend=false && terraform plan -out=tfplan && terraform show -json tfplan > plan.json)
              conftest test "$dir/plan.json" --policy policies/opa-conftest
            fi
          done
